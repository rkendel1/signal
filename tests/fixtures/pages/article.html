  <h1>The quiet return of the night train</h1>
  <p class="byline">By Ines Albrecht</p>
  <time datetime="2026-11-10T08:00:00Z">10 November 2026</time>
  <p>Across Europe, operators are reviving overnight rail routes that were abandoned a decade ago, citing demand from travellers who want to avoid short-haul flights.</p>
  <p>Ridership on the new routes grew 18% in the first year.</p>
